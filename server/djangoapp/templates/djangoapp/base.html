<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cars Dealership</title>
  <link rel="stylesheet" href="/static/bootstrap.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light p-3">
    <a class="navbar-brand" href="/djangoapp/">Cars Dealership</a>
    <a class="nav-link" href="/djangoapp/">Home</a>
    <a class="nav-link" href="/about">About Us</a>
    <a class="nav-link" href="/contact">Contact Us</a>

    <span class="nav-spacer"></span>

    {% if user.is_authenticated %}
      <span class="nav-link">Welcome {{ user.username }}</span>
      <a class="nav-link" href="/djangoapp/logout">Logout</a>
    {% else %}
      <span class="nav-link">Guest user</span>
      <a class="nav-link" href="/djangoapp/login">Login</a>
      <a class="nav-link" href="/djangoapp/register">Register</a>
    {% endif %}
  </nav>

  {% block content %}{% endblock %}
</body>
</html>
