{% extends 'djangoapp/base.html' %}{% block content %}<div class="container"><h1>Post Review for {{ dealer.full_name }}</h1><form method="post">{% csrf_token %}<label>Name</label><input name="name" value="{{ user.username|default:'Guest' }}"><label>Car Make</label><input name="car_make" value="Toyota"><label>Car Model</label><input name="car_model" value="Camry"><label>Car Year</label><input name="car_year" value="2024"><label>Purchase</label><select name="purchase"><option value="yes">Yes</option><option value="no">No</option></select><label>Review</label><textarea name="review" rows="5">Excellent service</textarea><button class="btn" type="submit">Submit Review</button></form></div>{% endblock %}
